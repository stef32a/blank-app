# Publică folderul harta/ pe GitHub Pages la fiecare push pe main.
# O singură dată: Settings → Pages → Source: „GitHub Actions”.
name: Publică harta pe GitHub Pages

on:
  push:
    branches: [main]
    paths: ["harta/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verifică datele hărții
        run: node tools/verifica.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: harta
      - id: deployment
        uses: actions/deploy-pages@v4
